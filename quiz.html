<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!--  Start of Navigation Bar -->

  <header> 
    
    <div class="navbar"> 
      <nav>
          <ul>
            <li> <a href="home.html"> Home </a> </li>
            <li> <a href="memories.html"> Memories </a> </li>
            <li> <a href="songs.html"> Songs </a> </li>
            <li> <a href="quiz.html"> Quiz </a> </li>
          </ul>
      </nav>
    </div>

  </header>

  <!--  End of Navigation Bar -->

  <section class="quiz-section">
 
    <!-- Quiz Card -->
    <div class="quiz-card" id="quiz-card">
      <div class="quiz-card-header">
        <span class="quiz-counter" id="quiz-counter">Question 1 of 10</span>
        <span class="quiz-score" id="quiz-score">Score: 0</span>
      </div>
      <p class="quiz-question" id="quiz-question">Question Placeholder:</p>
      <ul class="quiz-choices" id="quiz-choices">
        <!-- Populated by JS -->
      </ul>
    </div>
 
    <!-- Results Card (hidden until end) -->
    <div class="quiz-card quiz-results" id="quiz-results" style="display:none;">
      <p class="results-label">Quiz Complete!</p>
      <p class="results-score" id="results-score">You scored 0 / 10</p>
      <p class="results-message" id="results-message"></p>
      <button class="quiz-restart-btn" id="restart-btn">Try Again</button>
    </div>
 
  </section>

</body>
</html>
