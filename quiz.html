<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!--  Start of Navigation Bar -->

  <header> 
    
    <div class="navbar"> 
      <nav>
          <ul>
            <li> <a href="home.html"> Home </a> </li>
            <li> <a href="memories.html"> Memories </a> </li>
            <li> <a href="songs.html"> Songs </a> </li>
            <li> <a href="quiz.html"> Quiz </a> </li>
          </ul>
      </nav>
    </div>

  </header>

  <!--  End of Navigation Bar -->


  <!-- Start of Quiz -->

  <section class="quiz-section">
 
    <!-- Section Intro Card -->
    <div class="quiz-card quiz-intro" id="quiz-intro">
      <p class="quiz-section-tag" id="intro-tag">Section 1 of 2</p>
      <h2 class="quiz-intro-title" id="intro-title">How Well Do You Know Us?</h2>
      <p class="quiz-intro-desc" id="intro-desc">Answer these questions and see how well you really know us!</p>
      <button class="quiz-restart-btn" id="intro-btn">Start</button>
    </div>
 
    <!-- Quiz Card -->
    <div class="quiz-card" id="quiz-card" style="display:none;">
      <div class="quiz-card-header">
        <span class="quiz-counter" id="quiz-counter">Question 1 of 6</span>
        <span class="quiz-score" id="quiz-score">Score: 0</span>
      </div>
      <!-- Memory photo (Section 2 only) -->
      <div class="quiz-photo-wrap" id="quiz-photo-wrap" style="display:none;">
        <img id="quiz-photo" src="" alt="Memory Photo">
      </div>
      <p class="quiz-section-label" id="quiz-section-label">Section 1: How Well Do You Know Us?</p>
      <p class="quiz-question" id="quiz-question">Question Placeholder</p>
      <ul class="quiz-choices" id="quiz-choices"></ul>
    </div>
 
    <!-- Results Card -->
    <div class="quiz-card quiz-results" id="quiz-results" style="display:none;">
      <p class="results-label">Quiz Complete!</p>
      <p class="results-score" id="results-score">You scored 0 / 11</p>
      <p class="results-message" id="results-message"></p>
      <button class="quiz-restart-btn" id="restart-btn">Try Again</button>
    </div>
 
  </section>

  <!-- End of Quiz -->

</body>
</html>
