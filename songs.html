<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Songs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!--  Start of Navigation Bar -->

  <header> 
    
    <div class="navbar"> 
      <nav>
          <ul>
            <li> <a href="home.html"> Home </a> </li>
            <li> <a href="memories.html"> Memories </a> </li>
            <li> <a href="songs.html"> Songs </a> </li>
            <li> <a href="quiz.html"> Quiz </a> </li>
          </ul>
      </nav>
    </div>

  </header>


  <!-- Songs  Section -->

  <section class="songs-section">

    <!-- Left:  Album art and controls -->

    <div class="songs-left">
      <div class="album-art">
        <img id="album-img" src="" alt="Album Art">
      </div>
      <div class="song-info">
        <p id="song-title" class="song-title-display">Song Title</p>
        <p id="song-artist" class="song-artist-display">Artist Name</p>
      </div>
      <div class="song-controls">
        <button class="arrow-btn" id="prev-btn">&#8592;</button>
        <button class="play-btn" id="play-btn">&#9654</button>
        <button class="arrow-btn" id="next-btn">&#8594;</button>
      </div>
    </div>


        <!-- Middle: Song Meaning Card -->
    <div class="songs-middle">
      <p class="meaning-label">WHAT THIS SONG MEANS</p>
      <h2 id="meaning-title" class="meaning-title"></h2>
      <p id="meaning-text" class="meaning-text"></p>
    </div>
 
    <!-- Right: Playlist -->
    <div class="songs-right">
      <p class="playlist-label">PLAYLIST</p>
      <ul class="playlist" id="playlist">
        <!-- Populated by JS -->
      </ul>
    </div>


  </section>


  
  <!--  End of Navigation Bar -->

  <script src="script.js"> </script>


</body>
</html>
