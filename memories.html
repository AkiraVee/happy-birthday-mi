<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!--  Start of Navigation Bar -->

  <header> 
    
    <div class="navbar"> 
      <nav>
          <ul>
            <li> <a href="home.html"> Home </a> </li>
            <li> <a href="memories.html"> Memories </a> </li>
            <li> <a href="songs.html"> Songs </a> </li>
            <li> <a href="quiz.html"> Quiz </a> </li>
          </ul>
      </nav>
    </div>

  </header>

  <!--  End of Navigation Bar -->


  <!-- Start of Memories -->
 
  <section class="memories-hero" id="memories-hero">
 
    <!-- Background collage layer -->
    <img src="assets/images/memories/newspaper_graphics.png" alt="" class="deco deco-newspaper" aria-hidden="true">
    <img src="assets/images/memories/wool_graphics.png" alt="" class="deco deco-wave" aria-hidden="true">
 
    <!-- Page label, sits in the open space above the grid -->
    <div class="memories-header">
      <p class="memories-label">A LITTLE TIME CAPSULE</p>
      <h1 class="memories-title">Our Memories</h1>
    </div>
 
    <!-- Extra placeholder squares tucked behind the floral cluster -->
    <div class="memory-square standalone sq-5" data-caption="Tucked safely between old pages."></div>
    <div class="memory-square standalone sq-6" data-caption="Found while sorting through old photos."></div>
 
    <!-- Scattered stickers -->
    <img src="assets/images/memories/letter_graphics.png" alt="" class="deco deco-letter" aria-hidden="true">
    <img src="assets/images/memories/flower_2_graphics.png" alt="" class="deco deco-flower2" aria-hidden="true">
    <img src="assets/images/memories/flower_1_graphics.png" alt="" class="deco deco-flower1" aria-hidden="true">
    <img src="assets/images/memories/butterfly_graphics.png" alt="" class="deco deco-butterfly" aria-hidden="true">
    <img src="assets/images/memories/star_graphics.png" alt="" class="deco deco-star" aria-hidden="true">
    <img src="assets/images/memories/stuff_toy_graphics.png" alt="" class="deco deco-bunny" aria-hidden="true">
    <img src="assets/images/memories/headset_graphics.png" alt="" class="deco deco-headset" aria-hidden="true">
    <img src="assets/images/memories/song_graphics.png" alt="" class="deco deco-song" aria-hidden="true">
 
    <!-- Camera, with a colored placeholder square peeking through the screen -->
    <div class="deco-camera-wrap">
      <div class="camera-screen"></div>
      <img src="assets/images/memories/camera_graphics.png" alt="" class="camera-img" aria-hidden="true">
    </div>
 
    <!--
      Photo Grid — tilted color-block placeholders for now.
      To swap a square for a real photo later: add style="background-image:url('assets/images/your-photo.jpg')"
      to that .memory-square div (the color will show until you do).
      Edit the caption text right here in the data-caption attributes.
    -->
    <div class="memory-grid" id="memory-grid">
      <div class="memory-square sq-1" data-caption="That afternoon we laughed until it hurt."></div>
      <div class="memory-square sq-2" data-caption="The day everything just felt right."></div>
      <div class="memory-square sq-3" data-caption="A quiet moment, just the two of us."></div>
      <div class="memory-square sq-4" data-caption="One for the memory books."></div>
    </div>
 
  </section>
 
  <!-- Memory Lightbox -->
  <div class="memory-modal-overlay" id="memory-modal-overlay">
    <div class="memory-modal">
      <button class="memory-modal-close" id="memory-modal-close" aria-label="Close">&times;</button>
      <div class="memory-modal-photo" id="memory-modal-photo"></div>
      <p class="memory-modal-caption" id="memory-modal-caption"></p>
    </div>
  </div>
 
  <!-- End of Memories -->


  <script src="script.js"> </script>


</body>
</html>
